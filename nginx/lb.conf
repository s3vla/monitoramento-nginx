# Nginx balanceador (VM lb): distribui as requisições entre os Nginx de A e B
# Instalar em /etc/nginx/sites-available/lb

# Grupo de servidores de destino. Sem algoritmo declarado = round robin (alterna um a um)
upstream backends {
    server 192.168.56.11:80 max_fails=1 fail_timeout=10s;   # Nginx do srv-a (porta 80, NUNCA a 5000 da aplicação)
    server 192.168.56.12:80 max_fails=1 fail_timeout=10s;   # Nginx do srv-b; após 1 falha, fica 10 s fora da rotação
}

# Site principal: porta de entrada de todo o tráfego
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://backends;              # aponta para o grupo, não para um IP

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;                # IP do cliente real
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;                # backend fora do ar: desiste em 2 s (padrão é 60 s)
        proxy_next_upstream error timeout http_502 http_503 http_504;   # se um falhar, tenta o outro

        add_header X-Upstream $upstream_addr always;   # mostra para qual backend a requisição foi
    }
}

# Endpoint de status: só local, para o Nginx Prometheus Exporter do lb
server {
    listen 127.0.0.1:8080;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
