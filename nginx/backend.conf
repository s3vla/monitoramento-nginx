# Nginx dos servidores A e B: proxy reverso para a aplicação local
# Instalar em /etc/nginx/sites-available/backend (mesmo arquivo nas duas VMs)

# Site principal: recebe as requisições vindas do balanceador
server {
    listen 80;                                   # porta que o upstream do lb vai usar
    server_name _;                               # "_" = qualquer nome/IP (não usamos domínio)

    location / {
        proxy_pass http://127.0.0.1:5000;        # repassa para a aplicação, que só escuta no loopback

        # Cabeçalhos preservados: sem eles a aplicação veria tudo como vindo de 127.0.0.1
        proxy_set_header Host              $host;                       # nome/IP pedido pelo cliente
        proxy_set_header X-Real-IP         $remote_addr;                # IP de quem falou com ESTE Nginx (o lb)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # cadeia de IPs: cliente → lb → backend
        proxy_set_header X-Forwarded-Proto $scheme;                     # http ou https original

        add_header X-Backend $hostname always;   # identifica no cabeçalho qual VM respondeu (srv-a/srv-b)
    }
}

# Endpoint de status: só local, para o Nginx Prometheus Exporter da própria VM
server {
    listen 127.0.0.1:8080;                       # loopback: invisível para a rede

    location /nginx_status {
        stub_status;                             # contadores de conexões e requisições
        allow 127.0.0.1;                         # segunda trava: só aceita da própria máquina
        deny all;
    }
}
