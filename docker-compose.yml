# Prometheus e Grafana no PC (rodar na pasta do repositório: docker compose up -d)
#
# network_mode: host → os containers usam a rede do PC diretamente.
#   - O Prometheus alcança as VMs pela host-only (192.168.56.x) com o IP do PC (192.168.56.1),
#     que é exatamente o IP liberado no firewall dos exporters.
#   - O Grafana alcança o Prometheus em localhost:9090.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host                                   # Prometheus em http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # config do repositório (somente leitura)
      - prometheus-data:/prometheus                      # métricas coletadas sobrevivem a reinícios
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d                # guarda 15 dias de histórico
      - --web.enable-lifecycle                           # permite recarregar a config sem reiniciar
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest                    # edição open source (OSS)
    container_name: grafana
    network_mode: host                                   # Grafana em http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana                    # usuários e preferências sobrevivem a reinícios
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # fonte de dados e carregador de dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro    # os dashboards JSON do repositório
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
